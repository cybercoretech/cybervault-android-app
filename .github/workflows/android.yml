name: Android
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
env:
  NDK_VERSION: 27.2.12479018
jobs:
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate Cybercore Web Kit integration
        run: |
          test -f docs/index.html
          test -f docs/styles.css
          test ! -e docs/app.js
          grep -q 'https://cybercoretech.github.io/kit/v1/cybercore.js' docs/index.html
          grep -q 'https://cybercoretech.github.io/kit/v1/effects.css' docs/index.html
          grep -q 'data-cc-effect="telemetry-pulse"' docs/index.html
          git diff --check
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      - name: Install SDK and NDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' "ndk;$NDK_VERSION"
      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup target add aarch64-linux-android x86_64-linux-android
          cargo install cargo-ndk --locked --version 4.1.2
      - name: Rust bridge checks
        working-directory: rust
        run: |
          cargo fmt --check
          cargo clippy --all-targets --locked -- -D warnings
          cargo test --locked
      - name: Build, test, lint
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/${{ env.NDK_VERSION }}
        run: ./gradlew assembleDebug testDebugUnitTest lint assembleRelease
      - name: No network permission
        run: |
          ! "$ANDROID_HOME/build-tools/36.0.0/aapt2" dump permissions app/build/outputs/apk/release/app-release-unsigned.apk | grep -q 'android.permission.INTERNET'
      - uses: actions/upload-artifact@v7
        with:
          name: cybervault-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
