name: Android release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  NDK_VERSION: 27.2.12479018

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      - name: Install SDK and NDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' "ndk;$NDK_VERSION"
      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add aarch64-linux-android x86_64-linux-android
          cargo install cargo-ndk --locked --version 4.1.2
      - name: Validate release tag and calculate Android version code
        id: version
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [[ ! "$version" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "Tag must use vMAJOR.MINOR.PATCH (received $GITHUB_REF_NAME)" >&2
            exit 1
          fi
          major=$((10#${BASH_REMATCH[1]}))
          minor=$((10#${BASH_REMATCH[2]}))
          patch=$((10#${BASH_REMATCH[3]}))
          if (( minor > 999 || patch > 999 )); then
            echo "MINOR and PATCH must be at most 999 for Android versionCode mapping" >&2
            exit 1
          fi
          code=$((major * 1000000 + minor * 1000 + patch))
          echo "name=$version" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"
      - name: Prepare signing key
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.CYBERVAULT_RELEASE_KEYSTORE_BASE64 }}
        run: |
          test -n "$RELEASE_KEYSTORE_BASE64"
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/cybervault-release.p12"
          chmod 600 "$RUNNER_TEMP/cybervault-release.p12"
      - name: Test, lint, and build signed release APK
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/${{ env.NDK_VERSION }}
          CYBERVAULT_RELEASE_STORE_FILE: ${{ runner.temp }}/cybervault-release.p12
          CYBERVAULT_RELEASE_STORE_PASSWORD: ${{ secrets.CYBERVAULT_RELEASE_STORE_PASSWORD }}
          CYBERVAULT_RELEASE_KEY_ALIAS: ${{ secrets.CYBERVAULT_RELEASE_KEY_ALIAS }}
          CYBERVAULT_RELEASE_KEY_PASSWORD: ${{ secrets.CYBERVAULT_RELEASE_KEY_PASSWORD }}
        run: >-
          ./gradlew
          -PcybervaultVersionName=${{ steps.version.outputs.name }}
          -PcybervaultVersionCode=${{ steps.version.outputs.code }}
          :app:testDebugUnitTest
          :app:lintRelease
          :app:assembleRelease
      - name: Verify signature and prepare release assets
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/cybervault.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs dist/cybervault.apk | tee dist/signer.txt
          (cd dist && sha256sum cybervault.apk > cybervault.apk.sha256)
          cat > dist/INSTALL.txt <<'EOF'
          CyberVault for Android

          Quick install from a Linux/macOS computer with adb and a phone
          connected over USB (verifies the SHA-256 first):
            curl -fsSL https://cybercoretech.github.io/cybervault-android-app/install.sh | sh

          Manual install:
          1. Download cybervault.apk on Android 11 or newer.
          2. Open it and accept Android's install prompt.
          3. For updates, add https://github.com/cybercoretech/cybervault-android-app
             to Obtainium.

          Verify:  sha256sum --check cybervault.apk.sha256

          Android accepts updates only when they are signed with the same
          CyberVault release key.
          EOF
          {
            echo "## CyberVault ${{ steps.version.outputs.name }}"
            echo
            echo "Signed Android 11+ APK. Offline password vault with Keysmith built in, using the same encrypted vault format as the desktop [CyberVault](https://github.com/cybercoretech/cybervault)."
            echo
            echo '```sh'
            echo 'curl -fsSL https://cybercoretech.github.io/cybervault-android-app/install.sh | sh'
            echo '```'
            echo
            echo "SHA-256: \`$(cut -d' ' -f1 dist/cybervault.apk.sha256)\`"
          } > dist/RELEASE_NOTES.md
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/cybervault.apk \
            dist/cybervault.apk.sha256 \
            dist/INSTALL.txt \
            --title "CyberVault ${{ steps.version.outputs.name }}" \
            --notes-file dist/RELEASE_NOTES.md
