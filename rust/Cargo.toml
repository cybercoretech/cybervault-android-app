[package]
name = "cybervault-mobile"
version = "0.1.0"
edition = "2021"
publish = false
description = "uniffi bridge: CyberVault's vault format + Keysmith's generators for the Android app"
license = "MIT"

[lib]
crate-type = ["cdylib", "lib"]
name = "cybervault_mobile"

[[bin]]
# Generates the Kotlin bindings from the compiled library (uniffi library mode).
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"
required-features = ["bindgen"]

[features]
bindgen = ["uniffi/cli"]

[dependencies]
# Pinned to release tags (Cargo.lock records the exact commits), so every
# build, including CI and F-Droid, compiles the same vault format and
# generators.
cybervault = { git = "https://github.com/cybercoretech/cybervault", tag = "v0.2.0", default-features = false }
keysmith = { git = "https://github.com/cybercoretech/keysmith", tag = "v0.2.0", default-features = false }
uniffi = "0.32.2"
zeroize = "1"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true
